# Staging-only. Throwaway branch for unslothai/unsloth#8082; never merged.
#
# Real Edge is the point here: it is the WebView2 the Windows desktop app
# embeds. Bundled Chromium runs first as the control, so a failure can be told
# apart from an Edge-channel-specific one.
#
# install.ps1 is the supported Windows installer; install.sh has no Windows
# branch. The runner script itself is bash, which windows-latest has via
# Git Bash, exactly as the upstream Windows UI workflow already invokes it.

name: "PR-8082 indicator engines windows-latest"

on:
  push:
    branches: [pr-8082-indicator-engines]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engines:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          & ./install.ps1 --local --no-torch *>&1 | Tee-Object -FilePath logs/install.log

      # install.ps1 puts unsloth.exe at $StudioHome\bin and adds that dir to the
      # User PATH via the registry, which does not propagate into a running Git
      # Bash session -- so the runner script below would hit "command not
      # found". Same step the upstream Windows UI workflow carries.
      - name: Add Unsloth shim to GITHUB_PATH
        shell: bash
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          if [ ! -f "$SHIM_DIR/unsloth.exe" ]; then
            echo "::error::unsloth.exe shim not found at $SHIM_DIR"
            ls -la ~/.unsloth/studio/ || true
            exit 1
          fi
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"
          echo "Added Unsloth shim dir to PATH: $(cygpath -w "$SHIM_DIR")"

      - name: Install Playwright engines
        shell: bash
        run: |
          python -m pip install 'playwright>=1.45'
          python -m playwright install chromium
          # Edge is a channel, not a bundled build; the runner has it preinstalled
          # but this makes the dependency explicit and fails loudly if it is not.
          python -m playwright install msedge || echo "msedge channel already present"

      - name: Chromium
        shell: bash
        run: bash .github/scripts/run-studio-indicator-browser.sh 18991 chromium

      - name: Edge (WebView2 engine)
        shell: bash
        run: bash .github/scripts/run-studio-indicator-browser.sh 18992 chromium msedge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicator-windows
          path: |
            logs/playwright-indicator-*
            logs/studio-indicator-*.log
            logs/install.log
          if-no-files-found: ignore
