name: "staging-15739 studio-regress"
on:
  push:
    branches: ["pr-15739-regress-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-before:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 65f72dbe5c3fd5f8d326ad9fd611773c430e296c
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Tauri build deps + WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf xvfb webkit2gtk-driver
          cargo install tauri-driver --locked
      - name: Studio backend for the app (~/.unsloth/studio)
        working-directory: src
        run: ./install.sh --local --no-torch
      - name: tauri build --debug --no-bundle (before)
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build)
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
      - name: Desktop journey (before)
        env:
          UNSLOTH_STUDIO_FAKE_UPDATE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" python harness/.github/scripts/studio_regress/journeys/desktop.py \
            --bin src/studio/src-tauri/target/debug/unsloth-studio --side before --out out --backend real
          echo "rc=$?" | tee out-desktop-before.rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-before-desktop
          path: |
            out/
            out-desktop-before.rc
  desktop-after:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: f63c95a2a03a135b4f86ad8e5f8b15b78cbad2cc
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Tauri build deps + WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf xvfb webkit2gtk-driver
          cargo install tauri-driver --locked
      - name: Studio backend for the app (~/.unsloth/studio)
        working-directory: src
        run: ./install.sh --local --no-torch
      - name: tauri build --debug --no-bundle (after)
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build)
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
      - name: Desktop journey (after)
        env:
          UNSLOTH_STUDIO_FAKE_UPDATE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" python harness/.github/scripts/studio_regress/journeys/desktop.py \
            --bin src/studio/src-tauri/target/debug/unsloth-studio --side after --out out --backend real
          echo "rc=$?" | tee out-desktop-after.rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-after-desktop
          path: |
            out/
            out-desktop-after.rc
  diff-ubuntu-latest:
    needs: [desktop-before, desktop-after]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: studio-regress-ubuntu-latest-*
          path: art
          merge-multiple: true
      - name: Pair and diff (ubuntu-latest)
        env:
          PYTHONPATH: harness/.github/scripts
        run: |
          pip install pillow numpy
          python harness/.github/scripts/studio_regress/diff.py --root art/out --json --report \
            --pr 15739 --base-sha 65f72dbe5c3fd5f8d326ad9fd611773c430e296c --head-sha f63c95a2a03a135b4f86ad8e5f8b15b78cbad2cc --side-rc art/out-*.rc \
            > diff-ubuntu-latest.json || true
          cp art/out/report.json report.json 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-report-ubuntu-latest
          path: |
            report.json
            diff-ubuntu-latest.json
            art/out/**/*.png
            art/out/**/*.json
      - name: Gate usable functional evidence
        if: always()
        run: |
          python -c 'import json, sys; r = json.load(open("report.json")); sys.exit(0 if r.get("functional") == "NO_REGRESSION" and r.get("steps") and all(s.get("verdict") != "VOID" for s in r["steps"]) else 1)'
