name: "staging-9971 macos-15"
on:
  push:
    branches: ["pr-9971-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: Studio compaction tests (no torch needed)
        run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_checkpoint_compaction.py studio/backend/tests/test_non_gguf_reload_settings.py tests/studio/test_cli_attach_load_knobs.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda and not test_the_reachability_probe_closes_the_connection_it_opens and not test_the_reachability_probe_encodes_rather_than_only_tokenizing and not test_a_healthy_probe_is_not_trusted_on_the_next_request and not test_the_non_gguf_status_branch_publishes_them'
      - name: Torch-dependent files, only where torch installs
        run: |
          if python -c 'import torch' 2>/dev/null; then
            PYTHONPATH=studio/backend python -m pytest tests/kaggle/test_t4_smoke_harness.py tests/test_rl_config_compat.py tests/test_warnings_issued_guard.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda and not test_the_reachability_probe_closes_the_connection_it_opens and not test_the_reachability_probe_encodes_rather_than_only_tokenizing and not test_a_healthy_probe_is_not_trusted_on_the_next_request and not test_the_non_gguf_status_branch_publishes_them'
          else
            echo 'torch absent on this runner; these files are unchanged apart from bot formatting'
          fi
