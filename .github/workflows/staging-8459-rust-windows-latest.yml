name: "staging-8459 rust windows-latest"
on:
  push:
    branches: ["pr-8459-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # generate_context! embeds frontendDist, so the bundle has to exist
      # before the crate will compile at all.
      - name: Build the frontend
        working-directory: studio/frontend
        run: |
          npm install --no-fund --no-audit
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast
      # The check that a type-check cannot make: the platform FFI has to link.
      - name: Release build, unsigned
        working-directory: studio/src-tauri
        run: cargo build --release
