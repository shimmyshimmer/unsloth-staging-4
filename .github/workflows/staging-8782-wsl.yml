name: "staging-8782 wsl-ubuntu"
on:
  push:
    branches: ["pr-8782-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04
      - name: Provider URL validation under WSL
        shell: wsl-bash {0}
        run: |
          set -e
          workspace=$(echo '${{ github.workspace }}' | tr -d ':' | tr '\\' '/' | tr '[:upper:]' '[:lower:]')
          cd "/mnt/${workspace}"
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip > /dev/null
          # No --break-system-packages: 22.04 ships pip 22.0.2, which predates
          # the flag, and its Python is not externally managed anyway.
          python3 -m pip install --quiet pytest httpx
          # The suite's conftest needs the full app stack, which is not what this
          # job tests; the validation file loads providers.py by path and needs
          # nothing else, so run it from a sibling directory.
          mkdir -p studio/backend/wsltests
          cp studio/backend/tests/test_provider_base_url_validation.py studio/backend/wsltests/
          cd studio/backend
          python3 -m pytest wsltests/test_provider_base_url_validation.py -q --tb=short
