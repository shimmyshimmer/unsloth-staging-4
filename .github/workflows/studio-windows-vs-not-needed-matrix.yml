# Vigorously proves Visual Studio is NOT needed to install or run Unsloth Studio,
# across the full set of GitHub-hosted Windows runners (x64 + ARM, VS2022/2025/2026).
# Visual Studio + CMake are hidden up front; then every check runs with no compiler:
#   1. PyTorch CPU installs via uv and a 1-layer net trains (loss drops). No Unsloth.
#   2. A prebuilt llama-server.exe (arch-aware) launches and reports its version.
#   3. install.ps1 --local installs Studio via the prebuilt llama.cpp path only
#      (no source-build fallback, no VS/CMake winget install).
#   4. Studio boots, loads unsloth/Qwen3.5-2B-MTP-GGUF UD-Q4_K_XL, and an agentic
#      loop creates hello.py and runs it, expecting "Hello".
# fail-fast:false so a flaky ARM/Studio step never hides the x64 results; the cheap
# universal proofs (1 + 2) run before the heavy Studio steps.

name: Windows VS-not-needed matrix

on:
  push:
    branches: [vs-not-needed-matrix]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vs-not-needed:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest        # == windows-2025
          - windows-2025
          - windows-2025-vs2026
          - windows-2022
          - windows-11-arm        # ARM64 (may be unavailable on public repos)
          - windows-11-vs2026-arm # ARM64, public preview
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      GGUF_REPO: unsloth/Qwen3.5-2B-MTP-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: Qwen3.5-2B-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18820'
      HF_HOME: ${{ github.workspace }}/hf-cache
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Report runner + whether Visual Studio is present
        shell: pwsh
        run: |
          Write-Host "OS=$env:RUNNER_OS ARCH=$env:RUNNER_ARCH image=$env:ImageOS/$env:ImageVersion"
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsw) {
            $y = & $vsw -latest -property catalog_productLineVersion 2>$null | Select-Object -First 1
            Write-Host "Visual Studio present on the stock image: productLineVersion=$y"
          } else { Write-Host "No vswhere/Visual Studio on this image." }

      # ── Hide Visual Studio + CMake so EVERYTHING below runs with no compiler ──
      - name: Hide Visual Studio + CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($d in @("$env:ProgramFiles\Microsoft Visual Studio", "${env:ProgramFiles(x86)}\Microsoft Visual Studio")) {
            if (Test-Path -LiteralPath $d) {
              Rename-Item -LiteralPath $d -NewName ((Split-Path $d -Leaf) + '.vsoff'); Write-Host "Hid VS: $d"
            }
          }
          $hidden = @()
          foreach ($c in (Get-Command cmake -All -ErrorAction SilentlyContinue)) {
            if ($c.Source -and (Test-Path -LiteralPath $c.Source)) {
              Rename-Item -LiteralPath $c.Source -NewName ((Split-Path $c.Source -Leaf) + '.off'); $hidden += $c.Source
            }
          }
          ("HIDDEN_CMAKE=" + ($hidden -join '|')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assert Visual Studio + CMake are undetectable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'tests/studio_setup_ps1/Get-FunctionSource.ps1')
          $setup = Join-Path $env:GITHUB_WORKSPACE 'studio/setup.ps1'
          foreach ($fn in @('Resolve-VsGeneratorFromLabel', 'Find-VsBuildTools')) {
            . ([scriptblock]::Create((Get-FunctionSource -Path $setup -Name $fn)))
          }
          if (Find-VsBuildTools) { Write-Error 'VS still detected'; exit 1 }
          if (Get-Command cmake -ErrorAction SilentlyContinue) { Write-Error 'cmake still on PATH'; exit 1 }
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { Write-Error 'cl.exe still on PATH'; exit 1 }
          Write-Host "Confirmed: no Visual Studio, no cmake, no cl.exe."

      # ── 1. PyTorch CPU via uv + a 1-layer net trains (no VS, no Unsloth) ──
      - name: PyTorch CPU installs via uv and a 1-layer net trains
        run: |
          python -m pip install --upgrade pip uv
          uv venv .torchenv
          VENV_PY=".torchenv/Scripts/python.exe"; [ -f "$VENV_PY" ] || VENV_PY=".torchenv/bin/python"
          uv pip install --python "$VENV_PY" torch --index-url https://download.pytorch.org/whl/cpu
          "$VENV_PY" .github/scripts/torch_cpu_train_smoke.py

      # ── 2. A prebuilt llama-server runs on this arch (no compiler) ──
      - name: Prebuilt llama-server launches (arch-aware, no VS)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/ggml-org/llama.cpp/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match "bin-win-cpu-$arch\.zip$" } | Select-Object -First 1
          if (-not $asset) { Write-Error "no prebuilt llama win-cpu-$arch asset in $($rel.tag_name)"; exit 1 }
          Write-Host "downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama_pre.zip
          Expand-Archive -Path llama_pre.zip -DestinationPath llama_pre -Force
          $exe = Get-ChildItem -Path llama_pre -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'llama-server.exe not found in prebuilt'; exit 1 }
          & $exe.FullName --version 2>&1 | Select-Object -First 5
          Write-Host "Prebuilt llama-server ($arch) launched with no Visual Studio."

      # ── HF model cache + prime ──
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v1

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        if: always() && steps.prime-hf.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v1

      - name: Pre-install Windows tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          npm install -g 'npm@^11' 2>&1 | Out-Host
          foreach ($p in @("$env:USERPROFILE\.unsloth", "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules", "$env:GITHUB_WORKSPACE\studio\frontend\dist")) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { }
          }

      # ── 3. install.ps1 uses the prebuilt llama.cpp path (no VS, no source build) ──
      - name: Install Studio (--local, --no-torch) with no build tools present
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          & ./install.ps1 --local --no-torch *>&1 | Tee-Object -FilePath logs/install.log

      - name: Assert prebuilt used AND no build tools were installed
        run: |
          LLAMA_DIR=~/.unsloth/llama.cpp
          fail=0
          grep -q "falling back to source build" logs/install.log && { echo "::error::source-build fallback without VS"; fail=1; }
          for pat in "Kitware.CMake" "Microsoft.VisualStudio.2022.BuildTools" "installing via winget"; do
            grep -qi "$pat" logs/install.log && { echo "::error::unexpected build-tool install: $pat"; fail=1; }
          done
          [ -f "$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json" ] || { echo "::error::no UNSLOTH_PREBUILT_INFO.json"; fail=1; }
          [ -f "$LLAMA_DIR/build/bin/Release/llama-server.exe" ] || { echo "::error::no llama-server.exe"; fail=1; }
          [ "$fail" = 0 ] || { grep -iE "cmake|visual studio|prebuilt|source build" logs/install.log | tail -40; exit 1; }
          echo "Prebuilt installed, no build tools:"; cat "$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json"

      - name: Add Studio shim to GITHUB_PATH
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          [ -f "$SHIM_DIR/unsloth.exe" ] || { echo "::error::unsloth.exe shim missing"; ls -la ~/.unsloth/studio/ || true; exit 1; }
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"

      # ── 4. Boot Studio, load the Qwen model, run the agentic hello.py loop ──
      - name: Boot Studio (API-only) and load Qwen3.5-2B UD-Q4_K_XL
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 180); do
            curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json && jq -e '.status=="healthy"' /tmp/health.json && break
            sleep 1
          done
          jq -e '.status=="healthy"' /tmp/health.json || { tail -200 logs/studio.log; exit 1; }
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CINoVS-$(python -c 'import secrets;print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"; echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" -H 'content-type: application/json' -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" -H 'content-type: application/json' -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --max-time 600 -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":4096}")
            [ "$HTTP" = 200 ] && { jq '{status,display_name,is_gguf}' /tmp/load.json; break; }
            echo "::warning::load attempt $attempt -> $HTTP"; cat /tmp/load.json || true; sleep 10
          done
          [ "$HTTP" = 200 ] || { echo "::error::model load failed"; exit 22; }

      - name: Agentic - create hello.py, run it, expect "Hello"
        run: |
          mkdir -p agent_work
          python .github/scripts/agentic_hello_test.py --base "http://127.0.0.1:${STUDIO_PORT}" --key "$API_KEY" --workdir agent_work

      - name: Plain inference sanity (prebuilt llama.cpp, no VS)
        run: |
          RESP=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/v1/chat/completions" -H "Authorization: Bearer $API_KEY" -H 'content-type: application/json' --max-time 240 -d '{"model":"default","messages":[{"role":"user","content":"Say hello in one word."}],"temperature":0,"max_tokens":16,"stream":false}')
          echo "$RESP" | jq -r '.choices[0].message.content'

      - name: Restore Visual Studio + CMake
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @("$env:ProgramFiles\Microsoft Visual Studio", "${env:ProgramFiles(x86)}\Microsoft Visual Studio")) {
            if (Test-Path -LiteralPath "$d.vsoff") { Rename-Item -LiteralPath "$d.vsoff" -NewName (Split-Path $d -Leaf) }
          }
          if ($env:HIDDEN_CMAKE) { foreach ($s in ($env:HIDDEN_CMAKE -split '\|')) { if ($s -and (Test-Path -LiteralPath "$s.off")) { Rename-Item -LiteralPath "$s.off" -NewName (Split-Path $s -Leaf) } } }

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vs-not-needed-${{ matrix.os }}
          path: |
            logs/install.log
            logs/studio.log
          retention-days: 7
