name: "staging-8078 macos-14"
on:
  push:
    branches: ["pr-8078-xplat-ci"]
    paths:
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-sidebar-items.ts'
      - 'studio/frontend/src/features/chat/runtime-provider.tsx'
      - 'studio/frontend/src/features/chat/utils/chat-title.ts'
      - 'studio/frontend/src/features/chat/utils/openapi-support.ts'
      - 'studio/frontend/src/features/chat/utils/repair-legacy-chat-titles.ts'
      - 'studio/frontend/src/features/chat/utils/run-with-concurrency.ts'
      - 'studio/frontend/src/features/chat/utils/serial-queue.ts'
      - 'studio/frontend/tests/chat-title-clip.test.ts'
      - 'studio/frontend/tests/openapi-support.test.ts'
      - 'studio/frontend/tests/run-with-concurrency.test.ts'
      - 'studio/frontend/tests/serial-queue.test.ts'
      - '.github/workflows/staging-8078-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/studio/test_chat_thread_title_cas.py tests/studio/test_legacy_chat_title_repair.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
