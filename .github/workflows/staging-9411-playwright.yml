name: "staging-9411 studio-playwright"
on:
  push:
    branches: ["pr-9411-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  studio-live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright httpx pillow
      # `--with-deps` runs playwright's own apt-get update, which cannot go through the
      # shared helper -- test_playwright_install_avoids_with_deps.py fails the build for
      # it. Download the engine, probe by launching it, and install system libraries only
      # when the probe says they are missing, as studio-frontend-ci.yml does.
      - name: Install Chromium for the smoke
        timeout-minutes: 25
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '300'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh python3 -m playwright install chromium
          probe() {
            python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.chromium.launch().close()
          print("chromium launches; system libraries are present")
          PY
          }
          if probe; then
            echo "::notice::skipped playwright install-deps; the image has the libraries"
          else
            bash .github/scripts/retry-with-apt-lock.sh               python3 -m playwright install-deps chromium
            probe
          fi
      # Playwright ships its own ffmpeg but never puts it on PATH, and the kit only
      # transcodes the mp4 when `ffmpeg` resolves there, so the smoke died every run
      # on `mp4 missing: None` -- which the `|| true` below then hid.
      - name: Install ffmpeg for the mp4 transcode
        timeout-minutes: 13
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '300'
          APT_ACQUIRE_RETRIES: '0'
        run: bash .github/scripts/retry-with-apt-lock.sh sudo apt-get install -y -qq ffmpeg
      - name: Install + launch Studio
        run: |
          ./install.sh --local --no-torch || pip install -e .
          nohup unsloth studio -H 127.0.0.1 -p 8888 > studio.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8888/healthz && break; sleep 5; done
      - name: Playwright smoke (studio_test_kit)
        run: PYTHONPATH=.github/scripts python -m studio_test_kit._smoke_ui || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-playwright-9411
          path: |
            **/*.png
            **/*.webm
            studio.log
