# Staging-only CI: validate the real Windows Job Object kill-on-job-close path
# (PR #6425). Throwaway; not for upstream. Needs only pytest -- the test imports
# stdlib-only utils/process_lifetime.
name: "orphan-lifetime windows-latest"
on:
  push:
    branches: [orphan-windows-ci]
    paths:
      - 'studio/backend/**'
      - '.github/workflows/orphan-lifetime-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'studio/backend/**'
      - '.github/workflows/orphan-lifetime-windows.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Process-lifetime tests (incl. real Windows Job Object)
        working-directory: studio/backend
        run: python -m pytest tests/test_process_lifetime.py -q -v
