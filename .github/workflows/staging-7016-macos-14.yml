name: "staging-7016 macos-14"
on:
  push:
    branches: ["pr-7016-xplat-ci"]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/sh/**'
      - 'tests/studio/test_pr7016_installer_probe.py'
      - '.github/workflows/staging-7016-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - name: PR 7016 installer probe
        run: python -m pytest tests/studio/test_pr7016_installer_probe.py -q --tb=short -rs -s
      - name: PR 7016 own shell test
        run: bash tests/sh/test_launcher_no_browser.sh
