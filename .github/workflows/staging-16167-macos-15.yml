name: "staging-16167 macos-15"
on:
  push:
    branches: ["pr-16167-xplat-mac-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      PYTHONUNBUFFERED: '1'
      GLOO_SOCKET_IFNAME: 'lo0'
      HF_HOME: '${{ github.workspace }}/.pp-hf-cache'
      HF_HUB_CACHE: '${{ github.workspace }}/.pp-hf-cache/hub'
      HF_HUB_OFFLINE: '1'
      PYTEST_ADDOPTS: '-vv -s --timeout=180 --timeout-method=thread -x'
      UNSLOTH_FORCE_GPU_PATH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart psutil
      - run: |
          for attempt in 1 2 3; do python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" trl peft && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
      - run: python -c "import torch, importlib.util as u; assert u.find_spec('unsloth_zoo'); print('torch', torch.__version__); assert '+cu' not in torch.__version__"
      - run: python -m pip install torch==2.10.0 transformers==5.5.0 peft==0.20.0
      - run: git fetch --no-tags origin e01000b15cc2b90ac3fc33ab7dbde1f0134ae090 && git checkout --detach e01000b15cc2b90ac3fc33ab7dbde1f0134ae090
      - run: python -c 'import base64; exec(base64.b64decode('"'"''"'"'))'
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest tests/test_pp_native_gloo.py::test_pp2_refusals tests/test_pp_native_gloo.py::test_split_layers_balances_lm_head tests/test_pp_native_gloo.py::test_derive_split_and_parts_are_structural_or_from_the_plan tests/test_pp_native_gloo.py::test_layer_call_format_reads_tuple_loops tests/test_pp_native_gloo.py::test_non_last_stage_compiles_as_one_graph tests/test_pp_native_gloo.py::test_pp2_entry_points_are_refused tests/test_pp_native_gloo.py::test_old_torch_pipelining_is_refused_before_the_model_is_cut -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' 2>&1 | tee -a pytest_out.txt || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
