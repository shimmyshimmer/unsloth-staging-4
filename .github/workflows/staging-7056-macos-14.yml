name: "staging-7056 macos-14"
on:
  push:
    branches: ["pr-7056-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_transformers_latest.py'
      - 'studio/backend/tests/test_transformers_version.py'
      - 'studio/backend/utils/models/model_config.py'
      - 'studio/backend/utils/transformers_latest.py'
      - 'studio/backend/utils/transformers_version.py'
      - 'studio/frontend/src/app/routes/__root.tsx'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/shared-composer.tsx'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - 'studio/frontend/src/features/transformers-upgrade/api/transformers-upgrade-api.ts'
      - 'studio/frontend/src/features/transformers-upgrade/components/transformers-upgrade-dialog.tsx'
      - 'studio/frontend/src/features/transformers-upgrade/hooks/use-transformers-upgrade-consent.ts'
      - 'studio/frontend/src/features/transformers-upgrade/index.ts'
      - 'studio/frontend/src/features/transformers-upgrade/stores/transformers-upgrade-dialog-store.ts'
      - 'studio/frontend/src/features/transformers-upgrade/types.ts'
      - '.github/workflows/staging-7056-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
