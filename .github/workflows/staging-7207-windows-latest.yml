name: "staging-7207 windows-latest"
on:
  push:
    branches: ["pr-7207-xplat-ci"]
    paths:
      - 'studio/backend/hub/routes/inventory.py'
      - 'studio/backend/hub/schemas/inventory.py'
      - 'studio/backend/hub/services/models/cache_inventory.py'
      - 'studio/backend/main.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/picker/__init__.py'
      - 'studio/backend/picker/routes/__init__.py'
      - 'studio/backend/picker/routes/templates.py'
      - 'studio/backend/picker/schemas.py'
      - 'studio/backend/picker/service.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/tests/test_export_absolute_paths.py'
      - 'studio/backend/tests/test_model_picker_regression.py'
      - 'studio/backend/tests/test_model_update_robustness.py'
      - 'studio/backend/tests/test_picker_service.py'
      - 'studio/backend/utils/models/gguf_metadata.py'
      - 'studio/frontend/src/app/routes/__root.tsx'
      - 'studio/frontend/src/components/app-sidebar.tsx'
      - '.github/workflows/staging-7207-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
