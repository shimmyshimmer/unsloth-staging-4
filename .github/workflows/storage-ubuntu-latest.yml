name: "storage-paths ubuntu-latest"
on:
  push:
    branches: [studio-file-locations-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: storage-path repro
        shell: bash
        run: |
          cd studio/backend
          PYTHONPATH=. python -m pytest tests/test_repro_discord_storage.py -q -s
      - name: shutdown / orphan repro
        shell: bash
        run: |
          cd studio/backend
          PYTHONPATH=.:${{ github.workspace }} python -m pytest tests/test_repro_discord_shutdown.py -q -s
      - name: job-object boundary repro
        shell: bash
        run: |
          cd studio/backend
          PYTHONPATH=.:${{ github.workspace }} python -m pytest tests/test_repro_job_boundary.py -q -s
