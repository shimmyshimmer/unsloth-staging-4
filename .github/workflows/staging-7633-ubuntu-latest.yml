name: "staging-7633 ubuntu-latest"
on:
  push:
    branches: ["pr-7633-xplat-ci"]
    paths:
      - 'studio/backend/core/export/export.py'
      - 'studio/backend/core/training/eval_dataset.py'
      - 'studio/backend/core/training/lifecycle.py'
      - 'studio/backend/core/training/provenance.py'
      - 'studio/backend/core/training/resume.py'
      - 'studio/backend/core/training/trainer.py'
      - 'studio/backend/core/training/training.py'
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/hub/routes/datasets.py'
      - 'studio/backend/hub/schemas/datasets.py'
      - 'studio/backend/hub/services/datasets/cache_inventory.py'
      - 'studio/backend/hub/services/datasets/formatting.py'
      - 'studio/backend/hub/services/datasets/local.py'
      - 'studio/backend/hub/tests/test_dataset_native_drop_upload.py'
      - 'studio/backend/hub/tests/test_dataset_services.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/hub/utils/dataset_cache.py'
      - 'studio/backend/hub/utils/dataset_processed_cache.py'
      - 'studio/backend/hub/utils/download_manifest.py'
      - 'studio/backend/hub/utils/hf_cache_state.py'
      - '.github/workflows/staging-7633-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' || echo 'cpu torch unavailable on ubuntu-latest'
      - run: python -m pip install 'transformers>=4.51,<5.5' safetensors || echo 'transformers unavailable on ubuntu-latest'
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_cached_snapshot_load_subdirs.py studio/backend/tests/test_consent_gate.py studio/backend/tests/test_dataset_cache_paths.py studio/backend/tests/test_dataset_check_format_missing.py studio/backend/tests/test_dataset_upload_limits.py studio/backend/tests/test_export_absolute_paths.py studio/backend/tests/test_export_multi_gpu_device_map.py studio/backend/tests/test_file_security.py studio/backend/tests/test_gpu_selection.py studio/backend/tests/test_llm_assist_startup_opt_in.py studio/backend/tests/test_mlx_stop_checkpoint.py studio/backend/tests/test_mlx_training_worker_config.py studio/backend/tests/test_model_cache_snapshot.py studio/backend/tests/test_model_identity.py studio/backend/tests/test_model_identity_peft_handoff.py studio/backend/tests/test_model_routes_snapshot_targets.py studio/backend/tests/test_models_get_model_config_case_resolution.py studio/backend/tests/test_resume_blocked_reason_surfaces.py studio/backend/tests/test_resume_blocker_reason.py studio/backend/tests/test_resume_pin_load_subdirs.py studio/backend/tests/test_security_gate_consistency.py studio/backend/tests/test_training_active_output_dir.py studio/backend/tests/test_training_cached_start.py studio/backend/tests/test_training_finalizing_phase.py studio/backend/tests/test_training_history_delete.py studio/backend/tests/test_training_history_update.py studio/backend/tests/test_training_preflight.py studio/backend/tests/test_training_preflight_offline_guard.py studio/backend/tests/test_training_progress_callback.py studio/backend/tests/test_training_progress_job_scope.py studio/backend/tests/test_training_provenance.py studio/backend/tests/test_training_pump_resilience.py studio/backend/tests/test_training_raw_support.py studio/backend/tests/test_training_start_idempotency.py studio/backend/tests/test_training_start_offload.py studio/backend/tests/test_training_stop_watchdog.py studio/backend/tests/test_training_streaming.py studio/backend/tests/test_training_xet_fallback.py studio/backend/tests/test_vision_cache.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_dataset_native_drop_upload.py studio/backend/hub/tests/test_dataset_services.py studio/backend/hub/tests/test_model_services.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
