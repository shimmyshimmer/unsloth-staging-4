name: llama-update windows-latest
on:
  push:
    branches: [llama-update-win-gpu]
    paths:
      - 'studio/**'
      - '.github/workflows/windows-llama-update.yml'
  pull_request:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/windows-llama-update.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-update-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend freshness dep
        run: python -m pip install "structlog>=24.1.0"
      - name: Windows in-app update e2e
        run: python studio/backend/tests/windows_update_e2e.py
