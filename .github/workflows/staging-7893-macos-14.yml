name: "staging-7893 macos-14"
on:
  push:
    branches: ["pr-7893-xplat-ci"]
    paths:
      - 'studio/backend/hub/routes/__init__.py'
      - 'studio/backend/hub/routes/hf_proxy.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/test_hf_proxy_route.py'
      - 'studio/frontend/src/features/hub/index.ts'
      - 'studio/frontend/src/features/hub/lib/hf-cache.ts'
      - 'studio/frontend/src/features/hub/lib/network.ts'
      - 'studio/frontend/src/features/images/train/example-dataset-cards.tsx'
      - 'studio/frontend/src/hooks/use-hf-dataset-splits.ts'
      - 'studio/frontend/src/main.tsx'
      - 'studio/frontend/tests/hf-proxy-fallback.test.ts'
      - '.github/workflows/staging-7893-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_hf_proxy_route.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
