name: "staging-9238 windows e2e 9167"
on:
  push:
    branches: ["pr-9238-e2e-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Sweep the range to find where shutil.which actually starts returning
        # the bare name, instead of asserting a boundary from the changelog.
        python: ['3.12.0', '3.12.1', '3.12.2', '3.12.3', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r studio/backend/requirements/studio.txt
        shell: bash
      - name: "end-to-end 9167 check"
        shell: bash
        run: PYTHONPATH=studio/backend python tests/e2e/windows_e2e_check.py
