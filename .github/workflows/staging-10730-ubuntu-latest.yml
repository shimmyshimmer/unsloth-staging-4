name: "staging-10730 ubuntu-latest"
on:
  push:
    branches: ["pr-10730-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch safetensors diffusers==0.40.0 transformers --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install torchao || echo "optional deps unavailable on ubuntu-latest"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_auto_policy.py studio/backend/tests/test_diffusion_backend.py studio/backend/tests/test_diffusion_convrot.py studio/backend/tests/test_diffusion_cuda_graph.py studio/backend/tests/test_diffusion_inference_info.py studio/backend/tests/test_diffusion_more_families.py studio/backend/tests/test_diffusion_nvfp4_backend.py studio/backend/tests/test_diffusion_nvfp4_gate.py studio/backend/tests/test_diffusion_nvfp4_linear.py studio/backend/tests/test_diffusion_nvfp4_policy.py studio/backend/tests/test_diffusion_nvfp4_protect.py studio/backend/tests/test_diffusion_nvfp4_protect_image.py studio/backend/tests/test_diffusion_pipeline_prequant.py studio/backend/tests/test_diffusion_prequant.py studio/backend/tests/test_diffusion_routes.py studio/backend/tests/test_diffusion_speed.py studio/backend/tests/test_diffusion_transformer_quant.py studio/backend/tests/test_nvfp4_diffusion_flag.py studio/backend/tests/test_saved_image_metadata_precision_contract.py studio/backend/tests/test_video_backend.py studio/backend/tests/test_video_prequant.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/loaded-models-sources.test.ts
