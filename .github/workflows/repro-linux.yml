name: "PR-8031 repro ubuntu-latest (WebKitGTK)"
on:
  push:
    branches: [pr-8031-ci]
    paths:
      - 'repro/**'
      - 'studio/frontend/src/lib/overlay-scrollbar.ts'
      - '.github/workflows/repro-linux.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webkitgtk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build the PR's measurement module
        run: npx --yes esbuild@0.24.2 studio/frontend/src/lib/overlay-scrollbar.ts --bundle --format=iife --global-name=OVL --outfile=repro/overlay-scrollbar.js

      - name: Install WebKitGTK + GTK python bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 \
          || sudo apt-get install -y --no-install-recommends \
            xvfb python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37
          dpkg -l | grep -i webkit || true

      - name: WebKitGTK, overlay scrollbars (default)
        env:
          REPRO_OUT: repro-out-webkitgtk-overlay.json
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python3 repro/gtk_probe.py

      - name: WebKitGTK, classic scrollbars (control)
        if: always()
        env:
          REPRO_OUT: repro-out-webkitgtk-classic.json
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python3 repro/gtk_probe.py --no-overlay

      - name: Playwright cross-check (chromium + webkit)
        if: always()
        env:
          REPRO_OUT: repro-out-linux-playwright.json
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium webkit
          xvfb-run -a python3 repro/pw_probe.py chromium webkit

      - name: Summary
        if: always()
        run: python3 repro/summarize.py ubuntu-latest repro-out-*.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-linux
          path: repro-out-*.json
