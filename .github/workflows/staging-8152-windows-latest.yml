name: "staging-8152 windows-latest"
on:
  push:
    branches: ["pr-8152-xplat-ci"]
    paths:
      - 'studio/backend/main.py'
      - 'studio/backend/tests/test_health_holds_verdict_during_mlx_repair.py'
      - 'studio/backend/utils/hardware/hardware.py'
      - 'studio/backend/utils/mlx_repair.py'
      - 'studio/frontend/src/config/env.ts'
      - 'studio/frontend/src/config/hardware-verdict-cache.ts'
      - 'studio/frontend/tests/hardware-verdict-recovery.test.ts'
      - 'studio/frontend/tests/provisional-hardware-verdict.test.ts'
      - '.github/workflows/staging-8152-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_health_holds_verdict_during_mlx_repair.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
