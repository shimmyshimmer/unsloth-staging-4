name: "tauri-check windows-latest"
on:
  push:
    branches: [studio-file-locations-ci]
    paths:
      - 'studio/src-tauri/**'
      - '.github/workflows/tauri-check-windows.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: studio/src-tauri
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: placeholder frontend dist
        shell: bash
        working-directory: .
        run: |
          # tauri::generate_context! reads frontendDist at compile time; this
          # check is about the Rust change, not the bundle.
          mkdir -p studio/frontend/dist
          echo '<!doctype html><title>ci</title>' > studio/frontend/dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
      - name: cargo check
        run: cargo check --all-targets
      - name: windows job object tests
        run: cargo test --bins windows_job -- --nocapture
