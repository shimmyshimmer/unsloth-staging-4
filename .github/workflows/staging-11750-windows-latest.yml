name: "staging-11750 windows-latest"
on:
  push:
    branches: ["pr-11750-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch transformers==5.5.0 peft accelerate compressed-tensors
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_adapter_training_precision.py studio/backend/tests/test_alpaca_ai_assist_mapping.py studio/backend/tests/test_build_prequant_checkpoint.py studio/backend/tests/test_chat_generation_lease_compat.py studio/backend/tests/test_chat_generation_runs.py studio/backend/tests/test_chat_generation_runs_pool.py studio/backend/tests/test_chat_generation_supervisor.py studio/backend/tests/test_chat_history_routes.py studio/backend/tests/test_chat_history_storage.py studio/backend/tests/test_chat_load_during_training.py studio/backend/tests/test_chat_thread_settings.py studio/backend/tests/test_control_markup_neutralize_7066.py studio/backend/tests/test_custom_provider_api_type.py studio/backend/tests/test_debug_log_routes.py studio/backend/tests/test_diffusers_repair.py studio/backend/tests/test_diffusion_backend.py studio/backend/tests/test_diffusion_cache.py studio/backend/tests/test_diffusion_cache_block_registry.py studio/backend/tests/test_diffusion_compat_preflight.py studio/backend/tests/test_diffusion_engine_load_contract.py studio/backend/tests/test_diffusion_memory.py studio/backend/tests/test_diffusion_more_families.py studio/backend/tests/test_diffusion_precision.py studio/backend/hub/tests/test_model_services.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
