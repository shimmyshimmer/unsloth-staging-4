name: "staging-8090 ubuntu-latest"
on:
  push:
    branches: ["pr-8090-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/model_ids.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_model_ids.py'
      - 'studio/backend/tests/test_models_list_resident_gguf_label.py'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - 'studio/frontend/src/features/hub/lib/model-identity.ts'
      - 'studio/frontend/src/features/model-picker/components/model-selector.tsx'
      - 'studio/frontend/src/features/model-picker/model-config/model-identity.ts'
      - 'studio/frontend/tests/model-identity.test.ts'
      - '.github/workflows/staging-8090-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_model_ids.py studio/backend/tests/test_models_list_resident_gguf_label.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
