name: "staging-7021 macos-14"
on:
  push:
    branches: ["pr-7021-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/diffusion.py'
      - 'studio/backend/core/inference/diffusion_attention.py'
      - 'studio/backend/core/inference/diffusion_precision.py'
      - 'studio/backend/core/inference/diffusion_prequant.py'
      - 'studio/backend/core/inference/diffusion_transformer_quant.py'
      - 'studio/backend/core/inference/diffusion_vae_quant.py'
      - 'studio/backend/core/inference/sd_cpp_backend.py'
      - 'studio/backend/core/inference/video.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/video.py'
      - 'studio/backend/tests/test_diffusion_attention_trim.py'
      - 'studio/backend/tests/test_diffusion_backend.py'
      - 'studio/backend/tests/test_diffusion_precision.py'
      - 'studio/backend/tests/test_diffusion_prequant.py'
      - 'studio/backend/tests/test_diffusion_transformer_quant.py'
      - 'studio/backend/tests/test_diffusion_vae_quant.py'
      - 'studio/backend/tests/test_sd_cpp_backend.py'
      - 'studio/backend/tests/test_video_backend.py'
      - 'studio/frontend/src/features/images/images-page.tsx'
      - '.github/workflows/staging-7021-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
