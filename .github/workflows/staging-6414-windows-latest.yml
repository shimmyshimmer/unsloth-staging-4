name: "staging-6414 windows-latest"
on:
  push:
    branches: ["pr-6414-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_server_args.py'
      - 'studio/backend/main.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/routes/training_vram.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/tests/test_gguf_metadata.py'
      - 'studio/backend/tests/test_gpu_memory_mode.py'
      - 'studio/backend/tests/test_gpu_selection.py'
      - 'studio/backend/tests/test_llama_cpp_no_context_shift.py'
      - 'studio/backend/tests/test_llama_cpp_props_readback.py'
      - 'studio/backend/tests/test_llama_server_args.py'
      - 'studio/backend/tests/test_tensor_parallel.py'
      - 'studio/backend/tests/test_tp_vision_regression.py'
      - 'studio/backend/utils/models/gguf_metadata.py'
      - 'studio/frontend/src/components/assistant-ui/model-selector/remembered-load-settings.ts'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - '.github/workflows/staging-6414-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
