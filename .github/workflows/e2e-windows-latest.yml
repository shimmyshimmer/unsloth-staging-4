name: "e2e-studio windows-latest"
on:
  push:
    branches: [studio-file-locations-ci]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install Studio under UNSLOTH_STUDIO_HOME
        shell: pwsh
        run: |
          $env:UNSLOTH_STUDIO_HOME = "$env:RUNNER_TEMP\studiohome"
          .\install.ps1 --local
          Get-ChildItem $env:UNSLOTH_STUDIO_HOME
      - name: e2e orphan + update repro
        shell: pwsh
        run: |
          python -m pip install httpx psutil
          $env:UNSLOTH_STUDIO_HOME = "$env:RUNNER_TEMP\studiohome"
          $env:STUDIO_HOME = $env:UNSLOTH_STUDIO_HOME
          $env:STUDIO_BIN = "$env:UNSLOTH_STUDIO_HOME\bin\unsloth.exe"
          $env:STUDIO_PORT = "8899"
          $env:STUDIO_REPO = $env:GITHUB_WORKSPACE
          $env:E2E_RESULTS = "$env:GITHUB_WORKSPACE\e2e_results.json"
          python -u studio\backend\tests\e2e_studio_orphan_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: |
            e2e_results.json
            e2e_server.log
