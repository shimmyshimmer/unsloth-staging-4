name: bpane-bench
on:
  push:
    branches: ["bench/bpane-ci"]
permissions:
  contents: read
jobs:
  pane:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        rep: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm refs
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/bp-*" | tee job/out/arm_ref.txt
      - name: Browser pane attribution (1 vs 150 turns, runtime variants, WebKit + Chromium)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          PANE_ARM_REFS: ${{ vars.PANE_ARM_REFS || 'base=bench/bp-base' }}
          PANE_REPS: "2"
          PANE_ENGINES: webkit,chromium
          PANE_VARIANTS: stock,noanim,nocontain,floor
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py pane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-${{ matrix.os }}-r${{ matrix.rep }}
          path: job/out
