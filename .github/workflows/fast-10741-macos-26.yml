name: "fast-10741 macos-26"
on:
  push:
    branches: ["pr-10741-fast-ci"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -c "import sys, platform; print(sys.version, platform.machine(), platform.system())"
      - name: clean_text tests via the standalone driver
        run: python tests/test_raw_text.py
      - name: clean_text tests via pytest
        run: |
          python -m pip install -q pytest
          python -m pytest tests/test_raw_text.py -q
      - name: decision hash over all 1114112 code points
        run: python .ci_clean_text_hash.py
