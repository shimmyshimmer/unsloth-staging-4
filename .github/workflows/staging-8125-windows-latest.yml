name: "staging-8125 windows-latest"
on:
  push:
    branches: ["pr-8125-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_llama_cpp_max_context_threshold.py studio/backend/tests/test_mlx_inference_backend.py studio/backend/tests/test_native_context_length.py studio/backend/tests/test_rag_retrieval.py tests/studio/test_backend_ci_parallel_isolation.py tests/studio/test_chat_autoload_failure_gate.py tests/studio/test_chat_preset_load_config.py tests/studio/test_mlx_context_platform_matrix.py tests/studio/test_model_picker_contracts.py tests/studio/test_multi_chat_prompt_queue_contract.py tests/studio/test_new_chat_context_recount.py tests/studio/test_project_chat_view_switch.py tests/studio/test_recipe_context_intent.py tests/studio/test_token_count_prompt_parity.py tests/studio/test_workflow_guards_run_unfiltered.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; if [ "$rc" = "1" ] && grep -qE "(enable_load_extension|RagExtensionUnavailable)" pytest_out.txt; then bad=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt); gap=$(grep -E "^(FAILED|ERROR) " pytest_out.txt | grep -cE "(enable_load_extension|RagExtensionUnavailable)"); if [ "$bad" -gt 0 ] && [ "$bad" = "$gap" ]; then echo "only tests needing a runner capability this image lacks failed"; rc=0; fi; fi; exit "$rc"
