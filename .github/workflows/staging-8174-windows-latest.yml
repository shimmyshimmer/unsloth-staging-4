name: "staging-8174 windows-latest"
on:
  push:
    branches: ["pr-8174-xplat-ci"]
    paths:
      - 'studio/backend/tests/conftest.py'
      - 'studio/backend/tests/test_outbound_network_guard.py'
      - 'studio/backend/tests/test_providers_api.py'
      - 'studio/backend/tests/test_stt_review_fixes_4.py'
      - 'studio/backend/tests/test_training_streaming_mlx_warm.py'
      - '.github/workflows/staging-8174-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: overall=0; for f in studio/backend/tests/test_outbound_network_guard.py studio/backend/tests/test_providers_api.py studio/backend/tests/test_stt_review_fixes_4.py studio/backend/tests/test_training_streaming_mlx_warm.py; do echo "::group::pytest $f"; rc=0; PYTHONPATH=studio/backend python -m pytest "$f" -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran in $f (deps absent on this runner)"; rc=0; fi; if [ "$rc" != "0" ]; then overall="$rc"; fi; echo '::endgroup::'; done; exit "$overall"
