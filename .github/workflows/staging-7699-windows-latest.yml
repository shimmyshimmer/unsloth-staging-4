name: "staging-7699 windows-latest"
on:
  push:
    branches: ["pr-7699-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/inference.py'
      - 'studio/backend/core/inference/mlx_inference.py'
      - 'studio/backend/core/inference/orchestrator.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_mlx_inference_backend.py'
      - 'studio/backend/tests/test_mlx_worker_audio_commands.py'
      - 'studio/backend/tests/test_orchestrator_unload_cancel.py'
      - 'studio/backend/tests/test_pr7699_worker_audio_mirror.py'
      - 'studio/backend/utils/models/model_config.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - '.github/workflows/staging-7699-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_mlx_inference_backend.py studio/backend/tests/test_mlx_worker_audio_commands.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_pr7699_worker_audio_mirror.py tests/studio/test_model_picker_contracts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
