name: "staging-7492 macos-14"
on:
  push:
    branches: ["pr-7492-xplat-ci"]
    paths:
      - 'studio/backend/loggers/handlers.py'
      - 'studio/backend/main.py'
      - 'studio/install_manifest.py'
      - 'studio/install_python_stack.py'
      - 'studio/setup.ps1'
      - 'studio/setup.sh'
      - 'studio/src-tauri/src/preflight.rs'
      - 'studio/src-tauri/src/preflight/managed.rs'
      - 'studio/src-tauri/src/preflight/version.rs'
      - '.github/workflows/staging-7492-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_install_manifest.py tests/studio/install/test_setup_fast_path_guard.py tests/studio/install/test_studio_extra_matches_requirements.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
