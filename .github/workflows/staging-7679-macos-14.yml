name: "staging-7679 macos-14"
on:
  push:
    branches: ["pr-7679-xplat-ci"]
    paths:
      - 'studio/frontend/src/features/chat/hooks/use-transfer-stats.ts'
      - 'studio/frontend/src/features/hub/download-manager/download-manager-config.ts'
      - 'studio/frontend/src/features/hub/download-manager/download-manager-types.ts'
      - 'studio/frontend/src/features/hub/download-manager/poll-loop.ts'
      - 'studio/frontend/src/features/hub/lib/format.ts'
      - 'studio/frontend/src/lib/transfer-stats.ts'
      - 'studio/frontend/tests/hub-download-rate.test.ts'
      - 'studio/frontend/tests/hub-format.test.ts'
      - '.github/workflows/staging-7679-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
