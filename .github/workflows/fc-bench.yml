name: fc-bench2
on:
  push:
    branches: ["bench/fc-ci2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fc:
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { os: ubuntu-latest, engines: chromium, throttle: "4", mutlog: "" }
          - { os: macos-15, engines: webkit, throttle: "1", mutlog: "main,fix" }
        rep: [1, 2, 3]
        include:
          - rep: 1
            order: "pre,main,main2,fix,fix2,col"
          - rep: 2
            order: "col,fix2,fix,main2,main,pre"
          - rep: 3
            order: "fix,main2,col,pre,fix2,main"
    runs-on: ${{ matrix.leg.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          python -m pip install -q playwright pyyaml
          for i in 1 2 3; do python -m playwright install --with-deps ${{ matrix.leg.engines }} && break; sleep 20; done
      - name: Fence colour bench
        env:
          BENCH_WORK: ${{ runner.temp }}/fcbench
          FC_ARMS: "pre=bench/fc-pre,main=bench/fc-main,main2=bench/fc-main2,fix=bench/fc-fix,fix2=bench/fc-fix2,col=bench/fc-col"
          FC_VARIANTS: ""
          FC_ORDER: ${{ matrix.order }}
          FC_LONGTASKS: ""
          FC_MUTLOG: ${{ matrix.leg.mutlog }}
          FC_REPO: ${{ github.repository }}
          FC_ENGINE: ${{ matrix.leg.engines }}
          FC_THROTTLE: ${{ matrix.leg.throttle }}
        run: |
          mkdir -p job && cd job
          python -u ../bench/run_fc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcfix-${{ matrix.leg.os }}-r${{ matrix.rep }}
          path: job/out
