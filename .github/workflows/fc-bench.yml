name: fc-bench
on:
  push:
    branches: ["bench/fc-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fc:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        include:
          - rep: 1
            order: "pre,main,main2,a,b,c,d,e,f,g"
          - rep: 2
            order: "g,f,e,d,c,b,a,main2,main,pre"
          - rep: 3
            order: "c,main2,a,pre,g,b,main,f,d,e"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          python -m pip install -q playwright pyyaml
          for i in 1 2 3; do python -m playwright install --with-deps webkit && break; sleep 20; done
      - name: Fence colour bench
        env:
          BENCH_WORK: ${{ runner.temp }}/fcbench
          FC_ARMS: "pre=bench/fc-pre,main=bench/fc-main,main2=bench/fc-main2,a=bench/fcv-a,b=bench/fcv-b,c=bench/fcv-c,d=bench/fcv-d,e=bench/fcv-e,f=bench/fcv-f,g=bench/fcv-g"
          FC_VARIANTS: ""
          FC_ORDER: ${{ matrix.order }}
          FC_LONGTASKS: ""
          FC_MUTLOG: "pre,main,a,c"
          FC_REPO: ${{ github.repository }}
          FC_ENGINE: webkit
          FC_THROTTLE: "1"
        run: |
          mkdir -p job && cd job
          python -u ../bench/run_fc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcbis-macos-r${{ matrix.rep }}
          path: job/out
