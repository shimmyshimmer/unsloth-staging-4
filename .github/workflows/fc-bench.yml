name: fc-bench
on:
  push:
    branches: ["bench/fc-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fc:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        include:
          - rep: 1
            order: "pre,main,uncap,noscroll,noblock,gutter,head"
          - rep: 2
            order: "head,gutter,noblock,noscroll,uncap,main,pre"
          - rep: 3
            order: "noscroll,pre,head,main,gutter,uncap,noblock"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          python -m pip install -q playwright pyyaml
          for i in 1 2 3; do python -m playwright install --with-deps webkit && break; sleep 20; done
      - name: Fence colour bench
        env:
          BENCH_WORK: ${{ runner.temp }}/fcbench
          FC_ARMS: "pre=bench/fc-pre,main=bench/fc-main,head=bench/fc-head"
          FC_VARIANTS: "uncap=main@v_uncap.css,noscroll=main@v_noscrollbar.js,noblock=main@v_noblock.js,gutter=main@v_gutter.css"
          FC_ORDER: ${{ matrix.order }}
          FC_LONGTASKS: "pre,main,head"
          FC_REPO: ${{ github.repository }}
          FC_ENGINE: webkit
          FC_THROTTLE: "1"
        run: |
          mkdir -p job && cd job
          python -u ../bench/run_fc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcabl-macos-r${{ matrix.rep }}
          path: job/out
