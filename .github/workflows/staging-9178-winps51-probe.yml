name: "staging-9178 Windows PowerShell 5.1 probe"

# Everything else about unslothai/unsloth#9140 was verified from Linux under
# pwsh 7. The two behaviours this fix turns on cannot be observed there:
#
#   * Windows PowerShell 5.1 compiles Add-Type by writing the source into %TEMP%
#     and shelling out to csc.exe. pwsh 7 uses in-memory Roslyn and never touches
#     %TEMP%, so neither the reported failure nor the private-%TEMP% retry can be
#     reproduced off 5.1.
#   * Remove-Item -Recurse follows a junction on 5.1 and deletes what it points
#     at. pwsh 7 fixed that, so the guard cannot be shown to matter off 5.1.
#
# Both run against the real thing here, on Windows PowerShell 5.1. The probe
# bodies live in .github/staging9178/*.ps1 because a PowerShell here-string
# terminator has to sit at column 0, which a YAML block scalar cannot express.

on:
  push:
    branches: ["pr-9178-xplat-ci"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  winps51:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, NOT pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm this really is Windows PowerShell 5.1
        run: |
          $PSVersionTable | Format-List | Out-String | Write-Host
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw "not Windows PowerShell: $($PSVersionTable.PSEdition)" }
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "not 5.x: $($PSVersionTable.PSVersion)" }

      - name: Extract the helper chains from both revisions
        run: |
          $ErrorActionPreference = 'Stop'
          # PINNED to the commit BEFORE the fix landed upstream. Reading
          # "old" from a branch stopped working the moment 9178 merged: staging
          # main now carries the fix, so origin/main:install.ps1 would hand back
          # the NEW file and every before/after check would compare it to itself.
          git fetch --quiet https://github.com/unslothai/unsloth.git 21296c427497ee775374103524f0db16ee4976e3
          git show 21296c427497ee775374103524f0db16ee4976e3^:install.ps1 | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\old-install.ps1"
          git show 21296c427497ee775374103524f0db16ee4976e3:install.ps1 | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\new-install.ps1"
          $old = Get-Content -Raw "$env:RUNNER_TEMP\old-install.ps1"
          $new = Get-Content -Raw "$env:RUNNER_TEMP\new-install.ps1"
          if ($old -eq $new) { throw "the two revisions are identical; the pin is wrong and nothing below would mean anything" }
          if ($old -match 'Get-StudioLexicalPath') { throw "the OLD revision already contains the fix; the pin is wrong" }
          & .\.github\staging9178\extract.ps1

      - name: Old and new agree on every identity, on a healthy host
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\parity_postmerge.ps1
          Write-Host ($out -join "`n")
          if (-not ($out -match '^PARITY:mismatches=0 of \d+$')) { throw "old and new did not agree on every path shape" }

      - name: The pre-fix installer reproduces issue 9140 here
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\reproduce_old.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'OLD:threw') { throw "the pre-fix installer did NOT reproduce the reported failure" }

      - name: The fixed installer takes its lock with the compiler dead
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\lock_with_dead_compiler.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'NEW:locked=True') { throw "the fixed installer failed to take the lock" }

      - name: The private %TEMP% retry recovers a REAL csc.exe compile
        run: |
          $ErrorActionPreference = 'Stop'
          $blocker = Join-Path $env:RUNNER_TEMP 'blocker'
          Set-Content -LiteralPath $blocker -Value 'not a directory'
          $env:DEAD_TEMP = Join-Path $blocker 'temp'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\retry_real_csc.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'RETRY:native=True') { throw "the private %TEMP% retry did not recover the compile" }
          if ($out -notcontains 'RETRY:type=True') { throw "the native type was not loaded" }
          if ($out -notcontains "RETRY:tmp=$env:DEAD_TEMP") { throw "%TEMP% was not restored to the inherited value" }
          if (-not ($out -match '^RETRY:resolve=.+')) { throw "the recovered helper could not resolve a path" }

      - name: A junction in the sweep costs the link, never its target
        run: |
          $ErrorActionPreference = 'Stop'
          # Establish how this host actually behaves first, so the guard is measured
          # against the real hazard rather than an assumption about it.
          $bare = Join-Path $env:RUNNER_TEMP 'bare'
          $bareTarget = Join-Path $bare 'precious'
          New-Item -ItemType Directory -Path $bareTarget -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bareTarget 'keepme.txt') -Value 'do not delete'
          $bareLink = Join-Path $bare 'link'
          cmd /c mklink /J "$bareLink" "$bareTarget" | Out-Host
          # Measurements, not assertions: both of these are ways of deleting a
          # junction that the guard deliberately does not use, and on 5.1 either
          # can throw in a way -ErrorAction cannot suppress, so catch and record.
          try { Remove-Item -LiteralPath $bareLink -Recurse -Force -ErrorAction SilentlyContinue }
          catch { Write-Host "unguarded -Recurse threw: $($_.Exception.GetType().Name)" }
          Write-Host "unguarded -Recurse: target intact=$(Test-Path -LiteralPath (Join-Path $bareTarget 'keepme.txt')) link gone=$(-not (Test-Path -LiteralPath $bareLink))"
          # And the same without -Recurse, which is what the guard used to do.
          $bareLink2 = Join-Path $bare 'link2'
          cmd /c mklink /J "$bareLink2" "$bareTarget" | Out-Host
          try { Remove-Item -LiteralPath $bareLink2 -Force -ErrorAction SilentlyContinue }
          catch { Write-Host "unguarded no -Recurse threw: $($_.Exception.GetType().Name)" }
          Write-Host "unguarded no -Recurse: target intact=$(Test-Path -LiteralPath (Join-Path $bareTarget 'keepme.txt')) link gone=$(-not (Test-Path -LiteralPath $bareLink2))"

          $root = Join-Path $env:RUNNER_TEMP 'sweep'
          $target = Join-Path $root 'precious'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'keepme.txt') -Value 'do not delete'
          $roots = Join-Path $root 'roots'
          New-Item -ItemType Directory -Path $roots -Force | Out-Null
          $stale = Join-Path $roots 'ust-999999-plain'
          New-Item -ItemType Directory -Path $stale -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $stale 'junk.txt') -Value 'x'
          (Get-Item -LiteralPath $stale -Force).LastWriteTime = (Get-Date).AddDays(-3)
          $link = Join-Path $roots 'ust-999999-link'
          cmd /c mklink /J "$link" "$target" | Out-Host
          # Age the junction ITSELF. A timestamp write through the link lands on
          # the target and leaves the link looking fresh, so the sweep would skip
          # it at the cutoff and never reach the reparse-point guard at all.
          $env:AGE_LINK_PATH = $link
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\age_link.ps1 | Out-Host
          $fresh = Join-Path $roots 'ust-999999-fresh'
          New-Item -ItemType Directory -Path $fresh -Force | Out-Null
          foreach ($e in @(Get-ChildItem -LiteralPath $roots -Directory -Filter "ust-*")) {
              Write-Host "sweep sees $($e.Name) lastWrite=$($e.LastWriteTime.ToString('s')) reparse=$([bool]($e.Attributes -band [System.IO.FileAttributes]::ReparsePoint))"
          }

          $env:SWEEP_ROOT = $roots
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\sweep_junction.ps1 | Out-Host
          $targetKept = Test-Path -LiteralPath (Join-Path $target 'keepme.txt')
          $linkGone = -not (Test-Path -LiteralPath $link)
          $staleGone = -not (Test-Path -LiteralPath $stale)
          $freshKept = Test-Path -LiteralPath $fresh
          Write-Host "targetKept=$targetKept linkGone=$linkGone staleGone=$staleGone freshKept=$freshKept"
          if (-not $targetKept) { throw "the sweep deleted THROUGH the junction" }
          if (-not $linkGone) { throw "the sweep left the stale junction behind" }
          if (-not $staleGone) { throw "the sweep did not remove an ordinary stale directory" }
          if (-not $freshKept) { throw "the sweep removed a directory that is not stale" }

      - name: A healthy host is byte-identical to the pre-fix installer
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HELPERS_FILE = "$env:RUNNER_TEMP\new-helpers.ps1"
          $newOut = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\mutex_names.ps1
          $env:HELPERS_FILE = "$env:RUNNER_TEMP\old-helpers.ps1"
          $oldOut = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\mutex_names.ps1
          Write-Host "new:`n$($newOut -join "`n")"
          Write-Host "old:`n$($oldOut -join "`n")"
          if (($newOut -join '|') -ne ($oldOut -join '|')) {
              throw "install mutex names DIVERGED from the pre-fix installer on a healthy host"
          }
          Write-Host "install mutex names are byte-identical to the pre-fix installer"

      - name: Measure the two open review claims on 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          # Claim 1: bracketed profile paths defeat New-Item -Path.
          $wild = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\wildcard_dir.ps1
          Write-Host ($wild -join "`n")

          # Claim 2: -Recurse walks into a junction nested BELOW the ust-* directory.
          $root = Join-Path $env:RUNNER_TEMP 'nested'
          $target = Join-Path $root 'precious'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'keepme.txt') -Value 'do not delete'
          $stale = Join-Path $root 'ust-999999-plain'
          New-Item -ItemType Directory -Path $stale -Force | Out-Null
          $inner = Join-Path $stale 'inner-link'
          cmd /c mklink /J "$inner" "$target" | Out-Host
          $env:NESTED_STALE = $stale
          $env:NESTED_TARGET = $target
          $nested = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\nested_junction.ps1
          Write-Host ($nested -join "`n")
          if ($nested -notcontains 'NESTED:target-intact=True') {
              Write-Host "MEASURED: -Recurse DID delete through a nested junction on this host"
          } else {
              Write-Host "MEASURED: -Recurse left the nested junction target intact on this host"
          }

      - name: Which API reveals a SUBST target without a compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'actual'
          New-Item -ItemType Directory -Path (Join-Path $target 'venv\Scripts') -Force | Out-Null
          $env:SUBST_TARGET = $target
          $env:SUBST_DRIVE = 'X:'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\subst_probe.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'SUBST:exists=True') { throw "could not create a SUBST drive to measure" }

      - name: A drive-less rooted link target stays on the link's drive
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\driverel_probe.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'DRIVEREL:created=True') { throw "could not create a drive-less rooted symlink to measure" }
          $resolved = ($out | Where-Object { $_ -like 'DRIVEREL:resolved=*' }) -replace '^DRIVEREL:resolved=', ''
          $expected = ($out | Where-Object { $_ -like 'DRIVEREL:expected=*' }) -replace '^DRIVEREL:expected=', ''
          if (-not [string]::Equals($resolved.TrimEnd('\'), $expected.TrimEnd('\'), [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "a drive-less rooted target resolved to '$resolved' instead of '$expected'"
          }

      - name: One directory, two spellings, one identity
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\identity_windows.ps1
          Write-Host ($out -join "`n")
          if ($out -notcontains 'ROOTED:unc=True') { throw "the rewritten UNC form is not rooted here" }
          if ($out -notcontains 'ROOTED:bare-unc-marker=False') { throw "UNC\server\share was already rooted; the rewrite is pointless" }
          if ($out -notcontains 'ROOTED:volume-guid=True') { throw "the rewritten volume GUID form is not rooted here" }
          if ($out -notcontains 'ROOTED:bare-volume-marker=False') { throw "the bare volume GUID form was already rooted; the rewrite is pointless" }
          # Measured, not assumed, and the first version of this asserted the
          # opposite: on .NET Framework GetPathRoot returns EMPTY for both
          # spellings, so keeping the prefix buys nothing there. What it buys is
          # IsPathRooted above, which is what stops the link resolver combining
          # the target with the link's own parent.
          if ($out -notcontains 'ROOT:extended=[]') { throw "GetPathRoot now understands the extended volume form; revisit the comment in install.ps1" }
          if ($out -notcontains 'ROOT:stripped=[]') { throw "GetPathRoot now understands the bare volume form; revisit the comment in install.ps1" }
          if ($out -notcontains 'REALSUBST:same=True') { throw "a real SUBST alias did not resolve to the same identity as its target" }
          # 8.3: only assert when the volume actually creates short names.
          if (($out -match '^SHORTID:short=') -and ($out -notcontains 'SHORTID:same=n/a (no short name on this volume)')) {
              if ($out -notcontains 'SHORTID:same=True') { throw "an 8.3 spelling did not resolve to the same identity as its long form" }
          }

      - name: Which API expands an 8.3 short name without a compiler
        run: |
          $ErrorActionPreference = 'Stop'
          # Once per volume: 8dot3 creation is enabled by default on the system
          # volume and disabled by default on the others, so measuring only the
          # runner temp disk would answer about the wrong one.
          foreach ($root in @($env:RUNNER_TEMP, (Join-Path $env:SystemDrive 'sn'))) {
              New-Item -ItemType Directory -Path $root -Force | Out-Null
              $env:PROBE_ROOT = $root
              $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\.github\staging9178\shortname_probe.ps1
              Write-Host ($out -join "`n")
          }
          # No assertion: this step exists to decide whether the 8.3 claim is
          # actionable on a compiler-blocked host at all, and 8dot3 name creation
          # is disabled by default on many modern volumes.
