name: "staging-15958 ubuntu-latest"
on:
  push:
    branches: ["pr-15958-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/account-permissions.test.ts tests/account-settings-ui.test.ts tests/cache-folder-breakdown.test.ts tests/cache-rows-model-folder.test.ts tests/debug-log-export.test.ts tests/dialog-toast-outside.test.ts tests/export-hub-repo-required.test.ts tests/general-settings-token-sync.test.ts tests/knowledge-base-composer-refresh.test.ts tests/knowledge-base-dialog-focus.test.ts tests/library-chats.test.ts tests/login-account-modes.test.ts tests/project-source-chip-open.test.ts tests/project-sources-model-without-tools.test.ts tests/projects-activity-and-polling.test.ts tests/projects-page-rows.test.ts tests/rag-thread-initialization.test.ts tests/sidebar-custom-sections.test.ts tests/sidebar-row-menu-and-pinned-folders.test.ts tests/tool-code-cell-bidi.test.ts
