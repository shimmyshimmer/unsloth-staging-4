name: "staging-7256 windows-latest"
on:
  push:
    branches: ["pr-7256-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pr:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PowerShell parse gate (install.ps1 / setup.ps1 / uninstall.ps1)
        shell: pwsh
        run: |
          foreach ($f in @('install.ps1', 'studio/setup.ps1', 'scripts/uninstall.ps1')) {
            if (-not (Test-Path $f)) { continue }
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
            Write-Host "$f parsed with no errors"
          }

      - name: tests/studio PowerShell suites (whole directory, no allowlist)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($f in (Get-ChildItem -Path tests/studio -Filter *.ps1 | Sort-Object Name)) {
            Write-Host "::group::$($f.Name)"
            pwsh -NoProfile -File $f.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Host "FAIL $($f.Name) (exit $code)"; $failed += $f.Name }
            else { Write-Host "PASS $($f.Name)" }
          }
          Write-Host "=== ps1 suites run: $((Get-ChildItem -Path tests/studio -Filter *.ps1).Count), failed: $($failed.Count) ==="
          if ($failed.Count -gt 0) { Write-Host ($failed -join ', '); exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer pytest
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/studio
          UNSLOTH_COMPILE_DISABLE: '1'
        run: |
          python -m pip install -q pytest pytest-timeout packaging
          python -m pytest -q --tb=short tests/python/test_cross_platform_parity.py tests/python/test_tokenizers_and_torch_constraint.py tests/studio/install/test_rocm_support.py

      # STAGING-ONLY, NOT part of upstream CI. All 7 upstream install.ps1 call sites
      # pass --no-torch, which skips exactly the code this PR changes.
      - name: "STAGING-ONLY: real torch install path (install.ps1, NO --no-torch)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:UNSLOTH_STUDIO_HOME = Join-Path $env:RUNNER_TEMP 'ustudio'
          $venv = Join-Path $env:UNSLOTH_STUDIO_HOME 'unsloth_studio'
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          python -m venv $venv
          $vpy = Join-Path $venv 'Scripts\python.exe'
          & $vpy -m pip install -q --upgrade pip
          & $vpy -m pip install -q "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          $seeded = (& $vpy -c "import importlib.metadata as m; print(m.version('torch'))" | Select-Object -Last 1).Trim()
          Write-Host "seeded torch: $seeded"
          New-Item -ItemType File -Force -Path (Join-Path $venv '.unsloth-studio-owned') | Out-Null
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $log = Join-Path (Get-Location) 'logs\install_keep.log'
          # NO --no-torch. This is the entire point of this staging-only job.
          $p = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-File','install.ps1','--local') `
                 -RedirectStandardOutput $log -RedirectStandardError 'logs\install_keep.err' -PassThru
          if (-not $p.WaitForExit(1800000)) { Write-Host 'bounded timeout reached; killing installer'; $p.Kill(); Start-Sleep 5 }
          Write-Host "installer exit: $($p.ExitCode)"
          Write-Host '::group::tail of installer log'
          if (Test-Path $log) { Get-Content $log -Tail 60 }
          if (Test-Path 'logs\install_keep.err') { Get-Content 'logs\install_keep.err' -Tail 30 }
          Write-Host '::endgroup::'
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          $rc = 0
          if ($text -match [regex]::Escape("existing install has torch $seeded -- keeping it")) {
            Write-Host "PASS decision: preservation line printed for torch $seeded"
          } else { Write-Host "FAIL decision: no preservation line for torch $seeded"; $rc = 1 }
          $after = ''
          if (Test-Path $vpy) { $after = (& $vpy -c "import importlib.metadata as m; print(m.version('torch'))" 2>$null | Select-Object -Last 1) }
          Write-Host "torch after install: '$after'"
          if ($after -and ($after -split '\+')[0] -eq $seeded) {
            Write-Host "PASS end-to-end: venv still on $seeded after a real (no --no-torch) install"
          } else { Write-Host "FAIL end-to-end: venv moved to '$after' (expected $seeded)"; $rc = 1 }
          exit $rc


  baseline_main:
    runs-on: windows-latest
    timeout-minutes: 75
