name: "staging-8036 macos-14"
on:
  push:
    branches: ["pr-8036-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/diffusion.py'
      - 'studio/backend/core/inference/sd_cpp_backend.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/tests/test_diffusion_backend.py'
      - 'studio/backend/tests/test_sd_cpp_backend.py'
      - 'studio/frontend/src/features/hub/download-manager/use-staged-download.ts'
      - 'studio/frontend/src/features/images/api.ts'
      - 'studio/frontend/src/features/images/images-page.tsx'
      - 'studio/frontend/src/features/model-picker/components/model-selector.tsx'
      - 'studio/frontend/src/features/model-picker/components/model-selector/pickers.tsx'
      - 'studio/frontend/src/features/model-picker/components/model-selector/types.ts'
      - 'studio/frontend/src/features/video/video-page.tsx'
      - '.github/workflows/staging-8036-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install 'torch>=2.4,<2.11' 'transformers>=4.51,<5.5'
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_backend.py studio/backend/tests/test_sd_cpp_backend.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
