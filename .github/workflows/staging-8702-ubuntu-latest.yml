name: "staging-8702 ubuntu-latest"
on:
  push:
    branches: ["pr-8702-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_inference_status_loaded_gguf.py studio/backend/tests/test_llama_cpp_start_failure_classification.py studio/backend/tests/test_llama_extra_args_compatibility.py studio/backend/tests/test_llama_extra_args_end_to_end.py studio/backend/tests/test_llama_extra_args_platforms.py studio/backend/tests/test_llama_flag_catalog.py studio/backend/tests/test_llama_server_args.py studio/backend/tests/test_openai_auto_switch.py studio/backend/tests/test_validate_diffusion_extra_args.py tests/studio/test_chat_autoload_failure_gate.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; exit "$rc"
